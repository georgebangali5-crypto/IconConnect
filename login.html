<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IconConnect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">IconConnect</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="browse.html">Browse</a>
        <a href="how-it-works.html">How It Works</a>
        <a href="booking.html">Booking</a>
    </nav>
</header>

<section class="login-section">
    <div class="login-box">
        <h2>Welcome Back</h2>
        <p>Login to your IconConnect account</p>

        <form id="loginForm">
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Password" required>

            <button type="submit" class="btn">Login</button>
        </form>

        <div class="login-links">
            <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
            <p><a href="#">Forgot Password?</a></p>
        </div>
    </div>
</section>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    // Admin login
    if (email === "admin@iconconnect.com" && password === "admin123") {
        alert("Welcome Admin!");
        window.location.href = "admin.html";
        return;
    }

    // User login
    const user = JSON.parse(localStorage.getItem("iconconnectUser"));

    if (
        user &&
        user.email === email &&
        user.password === password
    ) {
        alert("Login Successful!");
        window.location.href = "user-dashboard.html";
    } else {
        alert("Invalid email or password!");
    }
});
</script>

</body>
</html>
