<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Check Booking Status - IconConnect</title>

    <link rel="stylesheet" href="booking-status.css">

</head>


<body>


    <!-- ================================
         HEADER
    ================================= -->

    <header class="status-header">

        <div class="status-logo">
            IconConnect
        </div>


        <nav class="status-nav">

            <a href="index.html">
                Home
            </a>

            <a href="browse.html">
                Browse Celebrities
            </a>

            <a href="booking.html">
                Booking
            </a>

            <a href="booking-status.html" class="active">
                Check Booking Status
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>


    <!-- ================================
         MAIN CONTENT
    ================================= -->

    <main class="status-container">


        <section class="status-hero">

            <h1>
                Check Your Booking Status
            </h1>

            <p>
                Enter the email address you used when submitting your booking request.
            </p>

        </section>


        <!-- ================================
             SEARCH FORM
        ================================= -->

        <section class="status-search">

            <form id="statusForm">

                <div class="form-group">

                    <label for="statusEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="statusEmail"
                        placeholder="Enter your email address"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="status-btn"
                >
                    Check Booking Status
                </button>

            </form>

        </section>


        <!-- ================================
             BOOKING RESULTS
        ================================= -->

        <section
            id="statusResults"
            class="status-results"
        >

            <!-- Booking results will appear here -->

        </section>


    </main>


    <!-- JAVASCRIPT -->

    <script src="booking-status.js"></script>


</body>

</html>
