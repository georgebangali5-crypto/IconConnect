<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Browse Celebrities - IconConnect</title>

    <link rel="stylesheet" href="browse.css">

</head>


<body>


    <!-- =================================
         HEADER
    ================================== -->

    <header>

        <div class="logo">
            IconConnect
        </div>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a
                href="browse.html"
                class="active"
            >
                Browse Celebrities
            </a>

            <a href="how-it-works.html">
                How It Works
            </a>

            <a href="booking.html">
                Booking
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>


    <!-- =================================
         MAIN CONTENT
    ================================== -->

    <main class="browse-page">


        <!-- PAGE TITLE -->

        <section class="browse-hero">

            <h1>
                Browse Celebrities
            </h1>

            <p>
                Find and book the perfect celebrity for your event.
            </p>

        </section>


        <!-- =================================
             SEARCH AND FILTER
        ================================== -->

        <section class="browse-controls">

            <input
                type="text"
                id="searchCelebrity"
                placeholder="Search celebrity..."
            >


            <select id="categoryFilter">

                <option value="all">
                    All Categories
                </option>

                <option value="Musician">
                    Musicians
                </option>

                <option value="Influencer">
                    Influencers
                </option>

                <option value="Athlete">
                    Athletes
                </option>

                <option value="Actor">
                    Actors
                </option>

                <option value="Public Figure">
                    Public Figures
                </option>

            </select>

        </section>


        <!-- =================================
             CELEBRITY GRID
        ================================== -->

        <section
            id="CelebrityContainer"
            class="celebrity-grid"
        >

            <p>
                Loading celebrities...
            </p>

        </section>


    </main>


    <!-- =================================
         FOOTER
    ================================== -->

    <footer class="browse-footer">

        <p>
            © 2026 IconConnect. All Rights Reserved.
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="browse.js"></script>


</body>

</html>
